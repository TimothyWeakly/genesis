A.onplay=function(){$('play').innerHTML='&#10074;&#10074;'};A.onpause=function(){$('play').innerHTML='&#9654;';save()};
A.ontimeupdate=function(){capTick(performance.now());if(A.duration){$('seek').value=Math.round(A.currentTime/A.duration*1000);$('cur').textContent=fmt(A.currentTime)}if(Math.floor(A.currentTime)%5===0)save()};
A.onended=function(){if(idx<CH.length-1)load(idx+1,0,true)};
$('seek').oninput=function(){if(A.duration)A.currentTime=$('seek').value/1000*A.duration};
$('prev').onclick=function(){if(A.currentTime>5)A.currentTime=0;else load(Math.max(0,idx-1),0,true)};
$('next').onclick=function(){load(Math.min(CH.length-1,idx+1),0,true)};
$('back').onclick=function(){A.currentTime=Math.max(0,A.currentTime-15)};$('fwd').onclick=function(){A.currentTime=Math.min(A.duration||0,A.currentTime+15)};
$('listBtn').onclick=function(){$('sheet').classList.add('open')};$('close').onclick=function(){$('sheet').classList.remove('open')};
if('mediaSession' in navigator){var ms=navigator.mediaSession;ms.setActionHandler('play',function(){A.play()});ms.setActionHandler('pause',function(){A.pause()});
 ms.setActionHandler('previoustrack',function(){$('prev').onclick()});ms.setActionHandler('nexttrack',function(){$('next').onclick()})}
setCap();$('cc').onclick=function(){capOn=!capOn;try{localStorage.setItem(K+'_cc',capOn?'1':'0')}catch(e){}setCap()};
/* ---------- The prompt. The Sphere pours the words into it; tap it and it becomes the place to ask Jedidiah.
   Asking is optional and listening never depends on it. Jedidiah is reached only when the manifest names where he can be
   reached (manifest.ask_url). When he cannot be reached the prompt says so plainly and nothing is made up. ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var lastA='';
/* THE READER'S GYM (founder 20 Nov 2026): the conversation is held, and a reader can correct Jedidiah - start with "no", "that's wrong",
   "actually" or "correct". The correction is weighed against the Genesis text; nobody wins, fog is removed. */
var HIST=[],CORR=/^\s*(no\b|nope\b|that'?s (not|wrong)|thats (not|wrong)|wrong\b|incorrect\b|actually\b|correct(ion)?\b|you('?re| are) wrong)/i;
function timed(url,opt,ms){var c=new AbortController(),k=setTimeout(function(){c.abort()},ms);opt.signal=c.signal;return fetch(url,opt).finally(function(){clearTimeout(k)})}
function askMode(on){$('askf').hidden=!on;$('cap').style.display=on?'none':'flex';$('prompt').classList.toggle('asking',on);if(on)$('askq').focus()}
function note(s){$('cap').textContent=s}
$('prompt').onclick=function(e){if(e.target.closest&&e.target.closest('#askf'))return;if(J||wait)return;askMode($('askf').hidden)};
$('prompt').onkeydown=function(e){if(e.target===$('prompt')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();$('prompt').onclick(e)}};
$('askf').onsubmit=function(e){e.preventDefault();var q=$('askq').value.trim(),c=idx>=0?CH[idx]:null;if(!q)return;$('askq').value='';$('askq').blur();askMode(false);
 var was=!A.paused;
 if(!M||!M.ask_url){A.pause();speak(['Jedidiah cannot be reached from this page yet.','Listening works without him.'],was);return}
 A.pause();wait=true;$('prompt').classList.add('asking');launch('',performance.now());note('Looking for Jedidiah…');var t0=Date.now(),tick=null;
 function fail(){clearInterval(tick);wait=false;$('prompt').classList.remove('asking');speak(['Jedidiah is not reachable right now.','Nothing was made up in his place.'],was)}
 timed(M.ask_url.replace(/ask$/,'health'),{},7000).then(function(r){return r.json()}).then(function(){
  tick=setInterval(function(){note('Jedidiah is reading Genesis… '+Math.round((Date.now()-t0)/1000)+' s')},1000);
  return timed(M.ask_url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({book:'Genesis',chapter:c?c.chapter:null,question:q,history:HIST.slice(-6),correction:CORR.test(q)})},240000)})
 .then(function(r){return r.json()}).then(function(j){clearInterval(tick);wait=false;$('prompt').classList.remove('asking');
  var h='<p>'+esc(j.answer||'')+'</p>',parts=(j.answer||'').match(/[^.!?]+[.!?]+["”']?|[^.!?]+$/g)||[];parts=parts.map(function(s){return s.trim()}).filter(Boolean);
  (j.claims||[]).forEach(function(k){h+='<p class="q">“'+esc(k.quote)+'” — Genesis '+esc(k.chapter)+'</p>';parts.push('“'+k.quote+'” — Genesis '+k.chapter)});
  (j.unknowns||[]).forEach(function(u){h+='<p class="q">Unknown: '+esc(u)+'</p>';parts.push('Unknown: '+u)});
  lastA='<p class="q">You asked: '+esc(q)+'</p>'+h;HIST.push({q:q,a:j.answer||''});$('askq').placeholder='Ask, or correct Jedidiah';$('ask').hidden=false;
  if(parts.length)speak(parts,was);else fail()})
 .catch(fail)};
$('ask').onclick=function(){$('askb').innerHTML=lastA;$('askp').classList.add('open')};
$('askx').onclick=function(){$('askp').classList.remove('open')};

requestAnimationFrame(draw);
setTimeout(function(){askMode(true)},400);   /* the prompt is open from the start */
})();
